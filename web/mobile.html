<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberArcade</title>
<style>
:root{color-scheme:dark;--gold:#e7bd70;--line:#2b2b33;--muted:#9a9aa5;--surface:#19191f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101014;color:#eeeef2;font:15px system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:#101014f2;
  border-bottom:1px solid #ffffff0d;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand svg{width:22px;height:22px;color:#dddde5;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:24px 16px calc(28px + env(safe-area-inset-bottom))}
.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,8vw,36px);font-weight:730;letter-spacing:-1.2px}
.muted{color:var(--muted);font-size:13px;margin:6px 0 0}
#search{width:min(100%,220px);border:0;border-radius:24px;background:#202026;color:inherit;padding:12px 18px}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px}
article{min-width:0}
.cover{position:relative;aspect-ratio:2/3;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:#202026;color:#93939e}
.cover svg{width:40px;height:40px;opacity:.45;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cover a{position:absolute;inset:0;z-index:1;border-radius:8px}
.cover a:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.card-body{padding:12px 0 0;display:grid;gap:8px}
.card-body h2{margin:0;font-size:14px;line-height:20px;font-weight:600;min-height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.badge{font-size:11px;color:#9ed3a7;letter-spacing:.015em;text-transform:capitalize}
.play{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:7px 12px;border-radius:5px;background:#e4e4e9;color:#17171c;font-size:12px;font-weight:700;width:max-content}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:42px 20px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="CyberArcade">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="m15 5 2 3M7 16l2 3"/></svg>
    <span>CyberArcade</span>
  </a>
</header>
<main>
  <div class="heading">
    <div><h1>Library</h1><p class="muted" id="counts">__COUNTS__</p></div>
    <input id="search" type="search" placeholder="Search games" aria-label="Search games">
  </div>
  <div id="games">__GAMES__</div>
</main>
<script>
const search = document.getElementById('search');
const cards = [...document.querySelectorAll('#games article')];
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  for (const card of cards) {
    const match = !q || card.dataset.title.includes(q);
    card.hidden = !match;
    if (match) shown++;
  }
  document.getElementById('counts').textContent = shown === 1 ? '1 ready game' : shown + ' ready games';
});
</script>
</body>
</html>
